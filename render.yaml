# Render Blueprint - Sincere Emotion
# Documentation: https://render.com/docs/render-blueprints

services:
  # Web Service for Next.js app
  - type: web
    name: sincere-emotion
    runtime: node
    region: singapore
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sincere-emotion-db
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Sincere Emotion <noreply@resend.dev>"

# PostgreSQL Database
databases:
  - name: sincere-emotion-db
    plan: free
    databaseName: sincere_emotion
    ipAllowList: []  # Only accessible from Render services
