<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="400" y2="560">
      <stop offset="0%" stop-color="#0f0f18"/>
      <stop offset="100%" stop-color="#1a1a24"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="560" fill="url(#bg1)"/>
  
  <!-- Subtle texture pattern -->
  <rect x="0" y="0" width="400" height="560" fill="url(#bg1)" opacity="0.9"/>
  
  <!-- Top accent line -->
  <rect x="0" y="0" width="400" height="4" fill="url(#accent1)"/>
  
  <!-- Glow circle -->
  <circle cx="200" cy="200" r="80" fill="#f59e0b" opacity="0.06"/>
  <circle cx="200" cy="200" r="50" fill="#f59e0b" opacity="0.08"/>
  
  <!-- Day counter circle -->
  <circle cx="200" cy="185" r="45" fill="none" stroke="url(#accent1)" stroke-width="2.5" opacity="0.6"/>
  <text x="200" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#f59e0b" font-weight="bold">7</text>
  <text x="200" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b" letter-spacing="4" opacity="0.8">DAYS</text>
  
  <!-- Divider -->
  <line x1="140" y1="250" x2="260" y2="250" stroke="url(#accent1)" stroke-width="1" opacity="0.4"/>
  
  <!-- Title -->
  <text x="200" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#f8fafc" font-weight="bold" letter-spacing="1">Stop Chasing,</text>
  <text x="200" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#f8fafc" font-weight="bold" letter-spacing="1">Start Choosing</text>
  
  <!-- Subtitle -->
  <text x="200" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b" letter-spacing="1">A 7-DAY GUIDE TO HEALING</text>
  <text x="200" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b" letter-spacing="1">YOUR ATTACHMENT WOUNDS</text>
  
  <!-- Bottom accent -->
  <rect x="150" y="420" width="100" height="2" rx="1" fill="url(#accent1)" opacity="0.3"/>
  
  <!-- Author -->
  <text x="200" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#f59e0b" opacity="0.7">by Sophie</text>
  
  <!-- Bottom bar -->
  <rect x="0" y="540" width="400" height="20" fill="url(#accent1)" opacity="0.15"/>
  
  <!-- Border -->
  <rect x="16" y="16" width="368" height="528" rx="12" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.2"/>
</svg>
